name: Apply AS5600 scheduler fix v2

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/apply-as5600-scheduler-fix-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply exact source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected block not found in {path}")
              s2 = s.replace(old, new, 1)
              p.write_text(s2)

          replace_once('Firmware/MotorControl/as5600_utils.hpp',
          '''inline bool transaction_is_status(uint8_t slot) {
              return (slot & 7u) == 7u;
          }

          inline bool transaction_can_start''',
          '''inline bool transaction_is_status(uint8_t slot) {
              return (slot & 7u) == 7u;
          }

          inline uint8_t transaction_slot_after_completion(uint8_t slot, bool success) {
              // A failed or merely attempted transfer must be retried in the same slot.
              return success ? (uint8_t)(slot + 1u) : slot;
          }

          inline bool transaction_can_start''')

          replace_once('Firmware/MotorControl/encoder.hpp',
          '''    uint8_t as5600_bad_magnet_count_ = 0;
              uint8_t as5600_poll_ticks_ = 0;
              bool as5600_have_sample_ = false;''',
          '''    uint8_t as5600_bad_magnet_count_ = 0;
              uint8_t as5600_poll_ticks_ = 0;
              volatile uint8_t as5600_transaction_slot_ = 0;
              bool as5600_have_sample_ = false;''')

          replace_once('Firmware/MotorControl/encoder.cpp',
          '''    as5600_irq_consecutive_errors_ = 0;

              if (as5600_i2c_request_ == 1) {
                  as5600_last_sample_tick_ = odrv.n_evt_sampling_;
                  __DMB();
                  ++as5600_sample_seq_;
              } else if (as5600_i2c_request_ == 2) {
                  as5600_last_status_tick_ = odrv.n_evt_sampling_;
                  as5600_have_status_ = true;
                  __DMB();
                  ++as5600_status_seq_;
              }

              __DMB();
              ++as5600_complete_seq_;''',
          '''    as5600_irq_consecutive_errors_ = 0;
              bool completed_request = false;

              if (as5600_i2c_request_ == 1) {
                  as5600_last_sample_tick_ = odrv.n_evt_sampling_;
                  __DMB();
                  ++as5600_sample_seq_;
                  completed_request = true;
              } else if (as5600_i2c_request_ == 2) {
                  as5600_last_status_tick_ = odrv.n_evt_sampling_;
                  as5600_have_status_ = true;
                  __DMB();
                  ++as5600_status_seq_;
                  completed_request = true;
              }

              // Advance the 7-angle/1-status scheduler only after a successful
              // completion. A busy/error STATUS remains the current logical slot,
              // so the next free opportunity retries STATUS instead of starving it.
              if (completed_request)
                  as5600_transaction_slot_ = as5600::transaction_slot_after_completion(
                      as5600_transaction_slot_, true);

              __DMB();
              ++as5600_complete_seq_;''')

          replace_once('Firmware/MotorControl/encoder.cpp',
          '''            // One transaction slot every 250 us: seven RAW ANGLE reads then
                      // one STATUS read. This yields 3.5 kHz angle and 500 Hz status
                      // requests without placing STATUS immediately behind each angle.
                      if ((as5600_poll_ticks_ & 1u) == 0u) {
                          const uint8_t slot = (uint8_t)(as5600_poll_ticks_ >> 1);
                          if (as5600::transaction_is_status(slot)) {
                              as5600_start_read(0x0b, (uint8_t*)as5600_status_buf_, 1, 2);
                          } else {
                              as5600_start_read(0x0c, (uint8_t*)as5600_angle_buf_, 2, 1);
                          }
                      }
                      as5600_poll_ticks_++;''',
          '''            // Offer one transaction opportunity every 250 us. The logical
                      // 7-angle/1-status slot advances only after successful completion.
                      // This preserves STATUS service under I2C backpressure with the I2C
                      // IRQ below the FOC ControlLoop priority.
                      if ((as5600_poll_ticks_ & 1u) == 0u) {
                          const uint8_t slot = as5600_transaction_slot_;
                          if (as5600::transaction_is_status(slot)) {
                              as5600_start_read(0x0b, (uint8_t*)as5600_status_buf_, 1, 2);
                          } else {
                              as5600_start_read(0x0c, (uint8_t*)as5600_angle_buf_, 2, 1);
                          }
                      }
                      as5600_poll_ticks_++;''')

          replace_once('Firmware/Tests/test_as5600.cpp',
          '''        CHECK(as5600::transaction_is_status(15));
              }

              TEST_CASE("recovery resumes the existing multi-turn coordinate") {''',
          '''        CHECK(as5600::transaction_is_status(15));
              }

              TEST_CASE("transaction slot advances only after successful completion") {
                  uint8_t slot = 7;
                  CHECK(as5600::transaction_is_status(slot));
                  slot = as5600::transaction_slot_after_completion(slot, false);
                  CHECK(slot == 7);
                  CHECK(as5600::transaction_is_status(slot));
                  slot = as5600::transaction_slot_after_completion(slot, true);
                  CHECK(slot == 8);
                  CHECK(!as5600::transaction_is_status(slot));
                  CHECK(as5600::transaction_slot_after_completion(255, true) == 0);
              }

              TEST_CASE("failed status completion cannot be starved by angle slots") {
                  uint8_t slot = 0;
                  for (unsigned i = 0; i < 7; ++i) {
                      CHECK(!as5600::transaction_is_status(slot));
                      slot = as5600::transaction_slot_after_completion(slot, true);
                  }
                  CHECK(slot == 7);
                  CHECK(as5600::transaction_is_status(slot));
                  for (unsigned retry = 0; retry < 5; ++retry) {
                      slot = as5600::transaction_slot_after_completion(slot, false);
                      CHECK(slot == 7);
                      CHECK(as5600::transaction_is_status(slot));
                  }
                  slot = as5600::transaction_slot_after_completion(slot, true);
                  CHECK(slot == 8);
                  CHECK(!as5600::transaction_is_status(slot));
              }

              TEST_CASE("recovery resumes the existing multi-turn coordinate") {''')
          PY
          git diff --check
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/as5600-scheduler-fix.patch
          rm -f .github/workflows/apply-as5600-scheduler-fix.yml
          rm -f .github/workflows/apply-as5600-scheduler-fix-v2.yml
          git config user.name "AS5600 scheduler bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix AS5600 status starvation under I2C backpressure"
          git push origin HEAD:master
